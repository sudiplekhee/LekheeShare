<!-- templates/download_file.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ original_name }} - LekheeShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f5f7fb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .navbar-brand {
            font-weight: 700;
            color: #6c63ff;
        }
        .btn-primary {
            background-color: #6c63ff;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 2rem;
            font-weight: 600;
        }
        .file-icon {
            font-size: 5rem;
            color: #6c63ff;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-share-alt me-2"></i>LekheeShare
            </a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-body p-5 text-center">
                        <div class="file-icon mb-4">
                            <i class="fas fa-file-download"></i>
                        </div>
                        <h3 class="card-title mb-3">Download File</h3>
                        <p class="text-muted mb-4">{{ original_name }}</p>
                        
                        <a href="{{ url_for('download_file', filename=filename) }}" class="btn btn-primary btn-lg px-5" download="{{ original_name }}">
                            <i class="fas fa-download me-2"></i>Download
                        </a>
                        
                        <div class="mt-4">
                            <small class="text-muted">
                                <i class="fas fa-clock me-1"></i>This file will expire in 7 days
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
