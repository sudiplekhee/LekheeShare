<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Download File | LekheeShare</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            background: #f5f8fc;
            color: #102f50;
        }

        .navbar {
            height: 78px;
            background: #0d3154;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 17%;
        }

        .brand {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: 800;
        }

        .nav {
            display: flex;
            gap: 30px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .main {
            min-height: calc(100vh - 78px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 540px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 9px 16px;
            border-radius: 30px;
            background: #eaf4ff;
            color: #1976b9;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 40px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        h1 span {
            color: #1976b9;
        }

        .description {
            color: #718198;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border: 1px solid #dce6f0;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(35,65,95,.09);
        }

        .file-icon {
            width: 75px;
            height: 75px;
            margin: auto;
            margin-bottom: 20px;

            border-radius: 18px;
            background: #eaf4ff;
            color: #1976b9;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
        }

        .file-name {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .file-type {
            color: #8492a6;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            width: 100%;
            height: 56px;

            background: #0d3154;
            color: white;

            border-radius: 12px;
            text-decoration: none;

            font-size: 15px;
            font-weight: 700;

            transition: .2s;
        }

        .download-btn:hover {
            background: #164875;
            transform: translateY(-1px);
        }

        .back-btn {
            display: inline-block;
            margin-top: 18px;
            color: #1976b9;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            color: #91a0b2;
            font-size: 12px;
            padding: 20px;
        }

        @media(max-width:700px) {
            .navbar {
                padding: 0 20px;
            }

            .nav {
                gap: 12px;
            }

            .nav a {
                font-size: 11px;
            }

            h1 {
                font-size: 32px;
            }

            .card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <a href="{{ url_for('index') }}" class="brand">
        🔗 LekheeShare
    </a>

    <div class="nav">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('access_file') }}">Access File</a>
        <a href="{{ url_for('share_text') }}">Share Text</a>
    </div>

</nav>


<main class="main">

    <div class="container">

        <div class="badge">
            ✓ File Ready
        </div>

        <h1>
            Your <span>File</span> is Ready
        </h1>

        <p class="description">
            Your shared file has been found successfully.
        </p>


        <div class="card">

            <div class="file-icon">
                📄
            </div>

            <div class="file-name">
                {{ original_name }}
            </div>

            <div class="file-type">
                Ready to download
            </div>


            <a
                href="{{ url_for('download_file', filename=filename) }}"
                class="download-btn"
            >
                ⬇ Download File
            </a>


            <a
                href="{{ url_for('access_file') }}"
                class="back-btn"
            >
                ← Access another file
            </a>

        </div>

    </div>

</main>


<footer class="footer">
    © 2026 LekheeShare · Simple, Fast & Secure File Sharing
</footer>

</body>
</html>
