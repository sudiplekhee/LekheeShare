<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shared Text | LekheeShare</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy: #10385d;
            --navy-dark: #0b2d4d;
            --blue: #1678bd;
            --blue-light: #eaf5ff;
            --bg: #f4f8fc;
            --text: #173653;
            --muted: #71859a;
            --border: #dce7f1;
            --white: #ffffff;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 78px;
            background: var(--navy);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 16%;

            box-shadow: 0 4px 18px rgba(10, 40, 70, 0.12);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            color: white;
            text-decoration: none;

            font-size: 23px;
            font-weight: 800;
        }

        .logo i {
            font-size: 22px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;

            transition: 0.2s;
        }

        .nav-links a:hover {
            color: #9ed4ff;
        }

        /* ================= MAIN ================= */

        .main {
            min-height: calc(100vh - 78px);

            padding: 70px 20px;

            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        /* ================= HEADER ================= */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 8px 16px;

            background: var(--blue-light);
            color: var(--blue);

            border-radius: 30px;

            font-size: 13px;
            font-weight: 700;

            margin-bottom: 18px;
        }

        .status i {
            font-size: 12px;
        }

        .header h1 {
            font-size: 40px;
            font-weight: 800;

            color: var(--navy);

            margin-bottom: 10px;
        }

        .header h1 span {
            color: var(--blue);
        }

        .subtitle {
            color: var(--muted);
            font-size: 15px;
        }

        /* ================= CARD ================= */

        .card {
            background: white;

            border: 1px solid var(--border);
            border-radius: 22px;

            padding: 30px;

            box-shadow:
                0 18px 45px rgba(20, 60, 90, 0.08);
        }

        /* ================= FILE HEADER ================= */

        .file-header {
            display: flex;
            align-items: center;
            gap: 15px;

            padding-bottom: 22px;

            border-bottom: 1px solid var(--border);

            margin-bottom: 22px;
        }

        .file-icon {
            width: 55px;
            height: 55px;

            border-radius: 14px;

            background: var(--blue-light);
            color: var(--blue);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;
        }

        .file-details {
            min-width: 0;
        }

        .file-details h2 {
            font-size: 17px;
            font-weight: 750;

            color: var(--navy);

            word-break: break-word;
        }

        .file-details p {
            margin-top: 4px;

            font-size: 12px;
            color: var(--muted);
        }

        /* ================= TEXT CONTENT ================= */

        .content-label {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 10px;
        }

        .content-label span {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }

        .text-box {
            background: #f8fbfe;

            border: 1px solid var(--border);

            border-radius: 14px;

            padding: 22px;

            min-height: 300px;
            max-height: 500px;

            overflow-y: auto;

            white-space: pre-wrap;
            word-break: break-word;

            line-height: 1.75;

            font-size: 15px;

            color: #304b63;
        }

        /* ================= BUTTONS ================= */

        .buttons {
            display: flex;
            gap: 12px;

            margin-top: 22px;
        }

        .btn {
            flex: 1;

            height: 54px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 700;

            transition: 0.2s;
        }

        .download {
            background: var(--navy);
            color: white;
        }

        .download:hover {
            background: var(--navy-dark);
            transform: translateY(-1px);
        }

        .back {
            background: #edf3f8;
            color: var(--navy);
        }

        .back:hover {
            background: #e1ebf3;
            transform: translateY(-1px);
        }

        /* ================= FOOTER INFO ================= */

        .info {
            margin-top: 18px;

            text-align: center;

            color: var(--muted);

            font-size: 12px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                gap: 15px;
            }

            .nav-links a {
                font-size: 12px;
            }

            .main {
                padding: 45px 15px;
            }

            .header h1 {
                font-size: 30px;
            }

            .card {
                padding: 22px;
            }

            .buttons {
                flex-direction: column;
            }

            .text-box {
                min-height: 250px;
            }
        }

        @media (max-width: 480px) {

            .logo {
                font-size: 19px;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links a:nth-child(3) {
                display: none;
            }

            .header h1 {
                font-size: 27px;
            }

            .file-header {
                align-items: flex-start;
            }
        }
    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <a
        href="{{ url_for('index') }}"
        class="logo"
    >
        <i class="fas fa-link"></i>
        LekheeShare
    </a>


    <div class="nav-links">

        <a href="{{ url_for('index') }}">
            Home
        </a>

        <a href="{{ url_for('access_file') }}">
            Access File
        </a>

        <a href="{{ url_for('share_text') }}">
            Share Text
        </a>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<main class="main">

    <div class="container">


        <!-- HEADER -->

        <div class="header">

            <div class="status">
                <i class="fas fa-check-circle"></i>
                Text Ready
            </div>

            <h1>
                Your <span>Text</span> is Ready
            </h1>

            <p class="subtitle">
                Your shared text has been found successfully.
            </p>

        </div>


        <!-- CARD -->

        <div class="card">


            <!-- FILE INFORMATION -->

            <div class="file-header">

                <div class="file-icon">
                    <i class="fas fa-file-lines"></i>
                </div>


                <div class="file-details">

                    <h2>
                        {{ filename }}
                    </h2>

                    <p>
                        Shared text • Ready to view and download
                    </p>

                </div>

            </div>


            <!-- TEXT -->

            <div class="content-label">

                <span>
                    Shared Content
                </span>

            </div>


            <div class="text-box">
                {{ content }}
            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <a
                    href="{{ url_for('download_file', filename=filename) }}"
                    class="btn download"
                >
                    <i class="fas fa-download"></i>
                    Download Text
                </a>


                <a
                    href="{{ url_for('access_file') }}"
                    class="btn back"
                >
                    <i class="fas fa-key"></i>
                    Access Another
                </a>

            </div>


            <div class="info">

                <i class="fas fa-shield-halved"></i>

                Your shared content is available through LekheeShare.

            </div>


        </div>

    </div>

</main>


</body>
</html>
