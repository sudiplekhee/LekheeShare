<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ filename }} - LekheeShare</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8fc;
            color: #12365a;
            min-height: 100vh;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 80px;
            background: #12385d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 17%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-decoration: none;
            color: white;
            font-size: 25px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 27px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: #7eb8e8;
        }

        /* ================= MAIN ================= */

        .main {
            min-height: calc(100vh - 80px);
            padding: 90px 20px;
            display: flex;
            justify-content: center;
        }

        .content {
            width: 100%;
            max-width: 620px;
            text-align: center;
        }

        /* ================= TOP BADGE ================= */

        .badge {
            display: inline-block;
            background: #e8f3ff;
            color: #1878bd;
            padding: 9px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 22px;
        }

        /* ================= TITLE ================= */

        .title {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #12385d;
        }

        .title span {
            color: #1976bd;
        }

        .subtitle {
            color: #6d8198;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* ================= CARD ================= */

        .file-card {
            background: white;
            border: 1px solid #dce7f1;
            border-radius: 22px;
            padding: 38px;
            box-shadow: 0 15px 40px rgba(18, 56, 93, 0.08);
        }

        /* ================= FILE ICON ================= */

        .file-icon {
            width: 78px;
            height: 78px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: #e9f4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
        }

        .filename {
            color: #12385d;
            font-size: 22px;
            font-weight: 800;
            word-break: break-word;
            margin-bottom: 8px;
        }

        .file-status {
            color: #7b8fa4;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* ================= TEXT PREVIEW ================= */

        .text-preview {
            background: #f7fafd;
            border: 1px solid #dce7f1;
            border-radius: 14px;
            padding: 18px;
            text-align: left;
            max-height: 260px;
            overflow-y: auto;
            margin-bottom: 25px;
        }

        .text-preview pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.7;
            color: #304d69;
        }

        /* ================= DOWNLOAD BUTTON ================= */

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 58px;
            background: #12385d;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            transition: 0.25s;
            border: none;
            cursor: pointer;
        }

        .download-btn:hover {
            background: #0d2d4d;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(18, 56, 93, 0.2);
        }

        /* ================= ACCESS ANOTHER ================= */

        .access-link {
            display: inline-block;
            margin-top: 22px;
            color: #1976bd;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .access-link:hover {
            text-decoration: underline;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                gap: 14px;
            }

            .nav-links a {
                font-size: 13px;
            }

            .logo {
                font-size: 20px;
            }

            .main {
                padding: 60px 15px;
            }

            .title {
                font-size: 32px;
            }

            .file-card {
                padding: 25px 20px;
            }
        }

        @media (max-width: 480px) {

            .navbar {
                height: 70px;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links a:nth-child(1) {
                display: none;
            }

            .title {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <a href="{{ url_for('index') }}" class="logo">
            <span class="logo-icon">🔗</span>
            LekheeShare
        </a>

        <div class="nav-links">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('access_file') }}">Access File</a>
            <a href="{{ url_for('share_text') }}">Share Text</a>
        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <div class="content">

            <div class="badge">
                ✓ Text Ready
            </div>

            <h1 class="title">
                Your <span>Text</span> is Ready
            </h1>

            <p class="subtitle">
                Your shared text has been found successfully.
            </p>


            <!-- ================= CARD ================= -->

            <div class="file-card">

                <div class="file-icon">
                    📄
                </div>

                <div class="filename">
                    {{ filename }}
                </div>

                <div class="file-status">
                    Ready to download
                </div>


                <!-- TEXT PREVIEW -->

                <div class="text-preview">
                    <pre id="textContent">{{ content }}</pre>
                </div>


                <!-- DOWNLOAD -->

                <button
                    type="button"
                    class="download-btn"
                    onclick="downloadText()">
                    ↓ &nbsp; Download Text
                </button>


                <a
                    href="{{ url_for('access_file') }}"
                    class="access-link">
                    ← Access another file
                </a>

            </div>

        </div>

    </main>


    <script>
        function downloadText() {

            const content = {{ content|tojson }};
            const filename = {{ filename|tojson }};

            const blob = new Blob(
                [content],
                { type: "text/plain;charset=utf-8" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.href = url;
            link.download = filename || "shared-text.txt";

            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);

            URL.revokeObjectURL(url);
        }
    </script>

</body>
</html>
