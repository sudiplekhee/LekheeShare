<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Access File — LekheeShare</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #6c5ce7;
            --primary-dark: #5144c7;
            --text: #17172b;
            --muted: #77778c;
            --border: #e9e8f2;
            --bg: #f7f7fc;
        }

        body {
            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(162,155,254,.22),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 20%,
                    rgba(108,92,231,.14),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);
        }

        .navbar {
            height: 76px;

            background: rgba(255,255,255,.9);

            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
        }

        .nav-inner {
            width: min(1050px,92%);
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            text-decoration: none;

            color: var(--text);

            font-size: 20px;
            font-weight: 800;
        }

        .logo i {
            color: var(--primary);
            margin-right: 8px;
        }

        .home-btn {
            text-decoration: none;

            padding: 10px 16px;

            border-radius: 10px;

            color: var(--primary);

            background: #eeecff;

            font-size: 14px;
            font-weight: 700;
        }

        .container {
            width: min(550px,92%);

            margin: 80px auto;
        }

        .card {
            background: white;

            border: 1px solid var(--border);

            border-radius: 24px;

            padding: 45px;

            text-align: center;

            box-shadow:
                0 25px 70px rgba(36,32,75,.10);
        }

        .icon {
            width: 82px;
            height: 82px;

            margin: auto auto 22px;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eeecff;

            color: var(--primary);

            font-size: 34px;
        }

        h1 {
            font-size: 28px;

            margin-bottom: 10px;
        }

        .description {
            color: var(--muted);

            line-height: 1.6;

            margin-bottom: 30px;
        }

        .alert {
            padding: 13px;

            margin-bottom: 20px;

            border-radius: 10px;

            background: #ffe9e9;

            color: #d63031;

            font-size: 14px;
        }

        .input-label {
            display: block;

            text-align: left;

            margin-bottom: 9px;

            font-size: 13px;

            font-weight: 700;
        }

        .code-input {
            width: 100%;

            padding: 17px;

            border: 2px solid var(--border);

            border-radius: 14px;

            text-align: center;

            font-family: monospace;

            font-size: 28px;

            font-weight: 800;

            letter-spacing: 8px;

            outline: none;

            text-transform: uppercase;

            color: var(--primary);

            background: #fafafd;

            transition: .2s;
        }

        .code-input:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 4px rgba(108,92,231,.08);
        }

        .help {
            display: block;

            margin-top: 9px;

            color: var(--muted);

            font-size: 12px;
        }

        .submit-btn {
            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: var(--primary);

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        .submit-btn:hover {
            background: var(--primary-dark);
        }

        .back {
            display: inline-block;

            margin-top: 25px;

            color: var(--muted);

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }

        .back:hover {
            color: var(--primary);
        }

        @media(max-width:600px) {

            .card {
                padding: 30px 20px;
            }

            .code-input {
                font-size: 22px;
                letter-spacing: 5px;
            }

        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="nav-inner">

        <a href="/" class="logo">

            <i class="fas fa-share-nodes"></i>

            LekheeShare

        </a>


        <a href="/" class="home-btn">

            <i class="fas fa-house"></i>

            Home

        </a>

    </div>

</nav>



<div class="container">

    <div class="card">


        <div class="icon">

            <i class="fas fa-key"></i>

        </div>


        <h1>
            Access a shared file
        </h1>


        <p class="description">

            Enter the 6-character code you received
            to open the shared content.

        </p>



        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="alert">

                        <i class="fas fa-circle-exclamation"></i>

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}



        <form
            method="POST"
            action="{{ url_for('access_file') }}"
        >

            <label
                class="input-label"
                for="shareCode"
            >

                Share Code

            </label>


            <input
                type="text"
                id="shareCode"
                name="share_code"
                class="code-input"
                placeholder="ABC123"
                maxlength="6"
                minlength="6"
                pattern="[A-Za-z0-9]{6}"
                autocomplete="off"
                required
            >


            <small class="help">

                6 letters or numbers

            </small>


            <button
                type="submit"
                class="submit-btn"
            >

                <i class="fas fa-unlock"></i>

                Access File

            </button>

        </form>



        <a
            href="/"
            class="back"
        >

            <i class="fas fa-arrow-left"></i>

            Back to Home

        </a>


    </div>

</div>



<script>

    const input =
        document.getElementById("shareCode");


    input.addEventListener(
        "input",
        function() {

            this.value =
                this.value
                    .toUpperCase()
                    .replace(/[^A-Z0-9]/g, "")
                    .substring(0, 6);

        }
    );


    window.addEventListener(
        "DOMContentLoaded",
        function() {

            input.focus();

        }
    );

</script>


</body>

</html>
