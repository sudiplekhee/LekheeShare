<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access File - LekheeShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .access-icon {
            font-size: 4rem;
            color: #6c5ce7;
            margin-bottom: 1rem;
        }
        .form-control {
            border-radius: 0.5rem;
            padding: 1rem;
            font-size: 1.1rem;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 0.2rem rgba(108, 92, 231, 0.25);
        }
        .btn-primary {
            background: #6c5ce7;
            border: none;
            border-radius: 0.5rem;
            padding: 1rem 2rem;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #5a4fcf;
            transform: translateY(-2px);
        }
        .code-input {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
        }
        .back-link {
            color: #6c5ce7;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            color: #5a4fcf;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-body p-5 text-center">
                        <div class="access-icon">
                            <i class="fas fa-key"></i>
                        </div>
                        <h2 class="card-title mb-3">Access Shared File</h2>
                        <p class="text-muted mb-4">
                            Enter the 6-character share code to access the file
                        </p>
                        
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-danger" role="alert">
                                        {{ message }}
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}
                        
                        <form method="POST" action="{{ url_for('access_file') }}">
                            <div class="mb-4">
                                <input type="text" 
                                       class="form-control code-input" 
                                       id="shareCode" 
                                       name="share_code" 
                                       placeholder="ENTER CODE" 
                                       maxlength="6" 
                                       pattern="[A-Z0-9]{6}"
                                       required>
                                <small class="text-muted">Enter the 6-character code (letters and numbers only)</small>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-unlock me-2"></i>Access File
                                </button>
                            </div>
                        </form>
                        
                        <div class="mt-4">
                            <a href="/" class="back-link">
                                <i class="fas fa-arrow-left me-2"></i>Back to Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auto-uppercase and format the input
        document.getElementById('shareCode').addEventListener('input', function(e) {
            this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        });
        
        // Focus on input when page loads
        window.addEventListener('load', function() {
            document.getElementById('shareCode').focus();
        });
    </script>
</body>
</html>
